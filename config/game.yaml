# 游戏服务配置
listen: "127.0.0.1:8901"
logLevel: debug

# gate↔game 共享密钥（RegisterGate HMAC）；空=不校验，仅联调
gateSecret: "dev-gate-secret"

# 实例标识与对外可达地址（注册到 etcd 用，空 = 自动生成 / 回退 listen）
gameId: ""
advertise: ""
# 服务注册与发现（etcd）；endpoints 空 = 不注册
registry:
  endpoints: [] # 如 ["127.0.0.1:2379"]
  prefix: ""    # 空 = /mgame
  ttl: 10       # 租约秒数

# MongoDB（user/role 唯一持久层）；uri 空 = 启动失败
mongo:
  uri: "mongodb://127.0.0.1:27017"
  database: "mgame"

# Redis（读缓存 + 全局 roleId 自增）；addr 空 = 启动失败
redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

# 用户数据（game 专属）
user:
  prefix: "mgame:user:" # Redis 缓存键前缀
  ttl: 300              # 缓存过期秒数，0=不过期
  autoCreateRole: true  # 角色列表为空时允许 EnterGame(role_id=0) 自动建角

# game→guild 内网（公会服务地址与共享密钥；空 = 无公会功能）
guildServers: ["127.0.0.1:8903"]
guildSecret: "dev-guild-secret"

# game→rank 内网（排行榜写入；空 = 无排行榜功能）
rankServers: ["127.0.0.1:8904"]
rankSecret: "dev-rank-secret"

# 角色成长：升到下一级需 expBase*当前等级经验，每次升级战力 +powerPerLevel
role:
  expBase: 100
  powerPerLevel: 100
  maxLevel: 100
