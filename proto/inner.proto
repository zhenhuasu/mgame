syntax = "proto3";

// 与 gate.proto 同属一个 proto/Go package：
// protoc-gen-msg 按 proto package 名生成 Go package 名，同目录必须一致
package gate;

option go_package = "github.com/zhenhuasu/mgame/proto;gate";

import "gate.proto"; // RoleInfo

// ---------- gate↔game 内网协议（tcp.ltv） ----------

// 握手：gate 连上后先发
// hmac = base64(HMAC-SHA256(gateSecret, gate_id|ts|nonce))，gateSecret 为空时留空
message RegisterGate {
  string gate_id = 1;
  int64  ts      = 2;
  string nonce   = 3;
  string hmac    = 4;
}

message RegisterAck {
  int32 code = 1; // 0=成功
}

// 玩家上线（gate → game，断线重连后补登记用，不触发用户加载）
message PlayerOnline {
  int64 uid = 1;
  string account = 2;
}

message PlayerOffline {
  int64 uid = 1;
  int32 reason = 2; // 0=主动退出 1=断线 2=顶号迁移到其他实例
}

// 登录握手（gate → game，仅客户端真正登录时发一次）
message PlayerLogin {
  int64 uid = 1;
  string account = 2; // 唯一键
  string ip = 3;      // 客户端出口 IP（gate 采集）
  string version = 4; // 客户端版本号
}

// 登录结果（game → gate），code=0 时 roles 为该账号角色列表
message PlayerLoginAck {
  int64 uid = 1;
  int32 code = 2; // 0=成功
  string reason = 3;
  repeated RoleInfo roles = 4;
}

// 通用服务间上行信封（gate→game、game→guild；后续服务间通用）。
// core/svcproc 在 OnInboundEvent 解包，业务层只注册/收到 payload 的最终协议。
message Transmit {
  int64  uid        = 1; // 来源用户（gate 填；game→guild 沿用）
  int64  role_id    = 2; // 在线角色（game 填，guild 业务需要）
  string role_name  = 3;
  int32  role_level = 4;
  uint32 msg_id     = 5; // payload 的最终消息 ID
  bytes  payload    = 6;
}

message ForwardS2C {
  int64 uid = 1;
  uint32 msg_id = 2;
  bytes payload = 3;
}

// 演示业务消息：由 game 处理，验证 gate 全链路转发
message HelloReq {
  string content = 1;
}

message HelloAck {
  string content = 1;
}

// ---------- game↔guild 内网协议（tcp.ltv） ----------

// 握手：game 连上 guild 后先发
// hmac = base64(HMAC-SHA256(guildSecret, game_id|ts|nonce))，secret 为空时留空
message RegisterGame {
  string game_id = 1;
  int64  ts      = 2;
  string nonce   = 3;
  string hmac    = 4;
}

// 公会回包（guild → game → ForwardS2C → gate → client）
message GuildS2C {
  int64  uid    = 1;
  uint32 msg_id = 2;
  bytes  payload = 3;
}

// 公会推送（guild → 所有已握手 game）：game 按在线角色命中后推送
message GuildNotify {
  int64  role_id = 1;
  uint32 msg_id  = 2;
  bytes  payload = 3;
}

// ---------- gate/game ↔ rank 内网协议（tcp.ltv） ----------

// 握手：gate/game 连上 rank 后先发
// hmac = base64(HMAC-SHA256(rankSecret, client_id|ts|nonce))，secret 为空时留空
message RegisterRank {
  string client_id = 1;
  string kind = 2; // game | gate
  int64  ts = 3;
  string nonce = 4;
  string hmac = 5;
}

message RegisterRankAck {
  int32 code = 1;
}

message RankProfile {
  int64 role_id = 1;
  string name = 2;
  string avatar = 3;
  int32 level = 4;
}

enum RankUpdateMode {
  RANK_UPDATE_DELTA = 0;
  RANK_UPDATE_OVERWRITE = 1;
}

message RankUpdate {
  RankProfile profile = 1;
  RankBoard board = 2;
  RankUpdateMode mode = 3;
  int64 value = 4; // delta 模式为增量，overwrite 模式为最终分数
}

message RankChangeNotify {
  int64 role_id = 1;
  RankBoard board = 2;
  int32 old_rank = 3; // 1-based，0=未上榜
  int32 new_rank = 4;
  int64 score = 5;
}
