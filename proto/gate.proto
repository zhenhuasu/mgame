syntax = "proto3";

package gate;

option go_package = "github.com/zhenhuasu/mgame/proto;gate";

// 客户端心跳/回环测试
message PingReq {
  int64 timestamp = 1;
}

message PingAck {
  int64 timestamp = 1;
  int64 session_id = 2;
}

// ---------- 登录/退出 ----------

// 角色信息（客户端展示用）
message RoleInfo {
  int64 role_id = 1;
  string name = 2;
  int32 level = 3;
}

message LoginReq {
  string account = 1;
  int64 uid = 2;
  string token = 3;
  string version = 4; // 客户端版本号
}

message LoginAck {
  int32 code = 1; // 0=成功
  string reason = 2;
  int64 uid = 3;
  repeated RoleInfo roles = 4; // 登录成功后由 game 加载的角色列表
}

message LogoutReq {}

message LogoutAck {
  int32 code = 1; // 0=成功
  string reason = 2;
}

// ---------- 角色 / 进入游戏 ----------

// 创建角色（登录后角色列表为空时发送）
message CreateRoleReq {
  string name = 1; // 同账号内唯一
}

message CreateRoleAck {
  int32 code = 1; // 0=成功
  string reason = 2;
  RoleInfo role = 3;
}

// 进入游戏：从登录返回的角色列表选一个 role_id
message EnterGameReq {
  int64 role_id = 1; // 0 = 请求服务端默认创建（受服务端 user.autoCreateRole 开关控制）
}

message EnterGameAck {
  int32 code = 1; // 0=成功
  string reason = 2;
  RoleInfo role = 3;
}

// 顶号：发给被踢的旧连接
message KickNtf {
  string reason = 1;
}

// ---------- 广播 ----------

// 服务端下行广播载荷
message NotifyNtf {
  string content = 1;
}

// 联调用：触发广播（uids 为空=全局广播，否则按 uid 列表）
// TODO 上线前移除或加权限校验
message BroadcastReq {
  repeated int64 uids = 1;
  string content = 2;
}

message BroadcastAck {
  int32 count = 1; // 实际送达会话数
}

// ---------- 公会 ----------

// 公会职位
enum GuildPosition {
  GUILD_POSITION_NONE = 0;
  GUILD_POSITION_LEADER = 1; // 会长
  GUILD_POSITION_VICE = 2;   // 副会长/管理员
  GUILD_POSITION_MEMBER = 3; // 成员
}

// 加入方式
enum GuildJoinMode {
  GUILD_JOIN_OPEN = 0;        // 公开直接加入
  GUILD_JOIN_INVITE_ONLY = 1; // 仅邀请加入
}

// 公会关键事件类型
enum GuildEventKind {
  GUILD_EVENT_NONE = 0;
  GUILD_EVENT_KICKED = 1;   // 被踢
  GUILD_EVENT_DISBANDED = 2;// 公会解散
  GUILD_EVENT_TRANSFER = 3; // 会长转让
  GUILD_EVENT_POSITION = 4; // 职位变更
}

message GuildInfo {
  int64 guild_id = 1;
  string name = 2;
  int64 leader_role_id = 3;
  string notice = 4;
  int32 level = 5;
  int32 member_count = 6;
  GuildJoinMode join_mode = 7;
}

message GuildMemberInfo {
  int64 role_id = 1;
  string name = 2;
  int32 level = 3;
  GuildPosition position = 4;
  int64 joined_at = 5; // unix 秒
}

message GuildInviteInfo {
  int64 guild_id = 1;
  string guild_name = 2;
  int64 invited_by = 3;
  string invited_by_name = 4;
  int64 created_at = 5; // unix 秒
}

message CreateGuildReq {
  string name = 1; // 全局唯一
}
message CreateGuildAck {
  int32 code = 1;
  string reason = 2;
  GuildInfo guild = 3;
}

message JoinGuildReq {
  int64 guild_id = 1;
}
message JoinGuildAck {
  int32 code = 1;
  string reason = 2;
  GuildInfo guild = 3;
}

message LeaveGuildReq {}
message LeaveGuildAck {
  int32 code = 1;
  string reason = 2;
}

message KickGuildMemberReq {
  int64 role_id = 1;
}
message KickGuildMemberAck {
  int32 code = 1;
  string reason = 2;
}

message TransferLeaderReq {
  int64 role_id = 1;
}
message TransferLeaderAck {
  int32 code = 1;
  string reason = 2;
}

message SetGuildNoticeReq {
  string notice = 1;
}
message SetGuildNoticeAck {
  int32 code = 1;
  string reason = 2;
}

message SetJoinModeReq {
  GuildJoinMode mode = 1;
}
message SetJoinModeAck {
  int32 code = 1;
  string reason = 2;
}

message SetMemberPositionReq {
  int64 role_id = 1;
  GuildPosition position = 2; // 仅 LEADER 可设为 VICE/MEMBER；会长不可通过此接口设置
}
message SetMemberPositionAck {
  int32 code = 1;
  string reason = 2;
}

message DisbandGuildReq {}
message DisbandGuildAck {
  int32 code = 1;
  string reason = 2;
}

message GetGuildInfoReq {
  int64 guild_id = 1; // 0 = 自己所在公会
}
message GetGuildInfoAck {
  int32 code = 1;
  string reason = 2;
  GuildInfo guild = 3;
  repeated GuildMemberInfo members = 4;
}

message ListGuildsReq {}
message ListGuildsAck {
  int32 code = 1;
  string reason = 2;
  repeated GuildInfo guilds = 3;
}

message InviteMemberReq {
  int64 role_id = 1; // role_id 优先
  string name = 2;   // role_id=0 时按角色名解析（全局唯一）
}
message InviteMemberAck {
  int32 code = 1;
  string reason = 2;
}

message ListInvitesReq {}
message ListInvitesAck {
  int32 code = 1;
  string reason = 2;
  repeated GuildInviteInfo invites = 3;
}

message RespondInviteReq {
  int64 guild_id = 1;
  bool accept = 2;
}
message RespondInviteAck {
  int32 code = 1;
  string reason = 2;
  GuildInfo guild = 3; // accept 成功时返回
}

// 邀请到达通知（推送给被邀请的在线角色）
message GuildInviteNtf {
  int64 guild_id = 1;
  string guild_name = 2;
  int64 invited_by = 3;
  string invited_by_name = 4;
}

// 公会关键事件通知（被踢/解散/转让/职位变更）
message GuildEventNtf {
  GuildEventKind kind = 1;
  int64 guild_id = 2;
  string guild_name = 3;
  GuildPosition position = 4; // 职位变更时的新职位
  int64 operator_role_id = 5;
}
