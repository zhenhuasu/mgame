syntax = "proto3";

package gate;

option go_package = "github.com/zhenhuasu/mgame/proto;gate";

// 客户端心跳/回环测试
message PingReq {
  int64 timestamp = 1;
}

message PingAck {
  int64 timestamp = 1;
  int64 session_id = 2;
}

// ---------- 登录/退出 ----------

// 角色信息（客户端展示用）
message RoleInfo {
  int64 role_id = 1;
  string name = 2;
  int32 level = 3;
}

message LoginReq {
  string account = 1;
  int64 uid = 2;
  string token = 3;
  string version = 4; // 客户端版本号
}

message LoginAck {
  int32 code = 1; // 0=成功
  string reason = 2;
  int64 uid = 3;
  repeated RoleInfo roles = 4; // 登录成功后由 game 加载的角色列表
}

message LogoutReq {}

message LogoutAck {
  int32 code = 1; // 0=成功
  string reason = 2;
}

// ---------- 角色 / 进入游戏 ----------

// 创建角色（登录后角色列表为空时发送）
message CreateRoleReq {
  string name = 1; // 同账号内唯一
}

message CreateRoleAck {
  int32 code = 1; // 0=成功
  string reason = 2;
  RoleInfo role = 3;
}

// 进入游戏：从登录返回的角色列表选一个 role_id
message EnterGameReq {
  int64 role_id = 1; // 0 = 请求服务端默认创建（受服务端 user.autoCreateRole 开关控制）
}

message EnterGameAck {
  int32 code = 1; // 0=成功
  string reason = 2;
  RoleInfo role = 3;
}

// 顶号：发给被踢的旧连接
message KickNtf {
  string reason = 1;
}

// ---------- 广播 ----------

// 服务端下行广播载荷
message NotifyNtf {
  string content = 1;
}

// 联调用：触发广播（uids 为空=全局广播，否则按 uid 列表）
// TODO 上线前移除或加权限校验
message BroadcastReq {
  repeated int64 uids = 1;
  string content = 2;
}

message BroadcastAck {
  int32 count = 1; // 实际送达会话数
}
